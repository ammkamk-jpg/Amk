name: Build FUT Snipe iOS (unsigned IPA)

# Builds an UNSIGNED .ipa on a cloud macOS runner (no Mac needed).
# Download the artifact, then install it from your PC with Sideloadly (free Apple ID).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: fut-snipe-ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: fut-snipe-ios
        run: |
          xcodebuild \
            -project FUTSnipe.xcodeproj \
            -target FUTSnipe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .ipa
        working-directory: fut-snipe-ios
        run: |
          APP="build/Build/Products/Release-iphoneos/FUTSnipe.app"
          if [ ! -d "$APP" ]; then echo "App not found at $APP"; ls -R build/Build/Products || true; exit 1; fi
          rm -rf Payload FUTSnipe-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -q FUTSnipe-unsigned.ipa Payload
          echo "Built:"; ls -lh FUTSnipe-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUTSnipe-unsigned-ipa
          path: fut-snipe-ios/FUTSnipe-unsigned.ipa
          retention-days: 14
